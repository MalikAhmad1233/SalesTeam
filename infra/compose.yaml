# Local development only. Never use these settings with real customer data.
#   docker compose -f infra/compose.yaml up -d db redis
#   (then run the API from services/backend, see services/backend/README.md)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mixt
      POSTGRES_PASSWORD: mixt-local-only
      POSTGRES_DB: mixt_dev
    ports: ["5432:5432"]
    volumes: ["mixt-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixt"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ../services/backend
    env_file: ../services/backend/.env
    environment:
      MIXT_DATABASE_URL: postgresql+psycopg://mixt:mixt-local-only@db:5432/mixt_dev
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  mixt-db:
