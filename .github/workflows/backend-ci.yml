name: backend-ci

on:
  push:
    paths: ["services/backend/**", ".github/workflows/backend-ci.yml", "docs/13-configurable-settings.md"]
  pull_request:
    paths: ["services/backend/**", ".github/workflows/backend-ci.yml", "docs/13-configurable-settings.md"]

permissions:
  contents: read

defaults:
  run:
    working-directory: services/backend

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check mixt tests migrations
      - run: uv run ruff format --check mixt tests migrations
      - run: uv run mypy mixt

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mixt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIXT_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mixt_test
      MIXT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest --cov=mixt --cov-report=term --cov-fail-under=85

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
      - run: uvx pip-audit --strict -r requirements.txt

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mixt-backend:ci .
