name: web-ci

on:
  push:
    paths: ["apps/web/**", "services/backend/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["apps/web/**", "services/backend/**", ".github/workflows/web-ci.yml"]

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mixt_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mixt_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Install backend
        working-directory: services/backend
        run: uv sync --frozen
      - name: Install dashboard
        working-directory: apps/web
        run: npm ci
      - name: API types are up to date with the backend
        working-directory: apps/web
        run: |
          (cd ../../services/backend && uv run python scripts/export_openapi.py ../../apps/web/openapi.json)
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api-types.ts
      - name: Type check
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Install browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end test (real backend and database)
        working-directory: apps/web
        run: npm run e2e
