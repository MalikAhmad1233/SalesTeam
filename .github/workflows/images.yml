name: images

# Publishes the three images to GitHub Container Registry for deployment
# (ghcr.io/<owner>/mixt-backend, mixt-web, mixt-backup), tagged with the commit SHA.
# Runs on the default branch, on version tags and on demand; feature branches are covered by
# staging-ci, which builds the same Dockerfiles.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: mixt-backend, context: services/backend }
          - { name: mixt-web, context: apps/web }
          - { name: mixt-backup, context: infra/backup }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
